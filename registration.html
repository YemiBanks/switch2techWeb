<!DOCTYPE html>

<html>
    <head>
        <title>Register</title>
        <link rel="stylesheet" href="./styles.css">

    </head>

    <body>
        <header>
        <h1>Register</h1>
        </header>

         <nav>
            <a href="index.html">Home</a> | <a href="about.html">About</a> | <a href="gallery.html">Gallery</a> | <a href="registration.html">Register</a>
        </nav>

        <main>
        <h2> Fill in the details to create an account </h2>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="tel">Phone Number:</label>
            <input type="tel" id="tel" name="tel" required><br><br>

            <label for="gender"> Gender </label>
            <select id="gender" name="name" required>
                <option value=""> Select Gender </option>
                <option value="Male"> Male </option>
                <option value="Female"> Female </option>
            </select><br><br>

            <label for="homeAddress">Home Address:</label><br><br>
            <input type="text" id="homeAddress" name="homeAddress" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>

            <label for="feedback"> FeedBack </label><br><br>
            <textarea id="feedback" name="feedback" rows="4" cols="50"> </textarea><br><br>

            <input type="submit" value="Register">
        </form>
        </main>

        <footer>
            <p style="text-align: center;">&copy; 2026 My Website. All rights reserved.</p>
        </footer>


    </body>




</html>
